[package]
name = "tauri-plugin-transcription"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
links = "tauri-plugin-transcription"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
