[package]
name = "rescript-studio"
version = "0.1.0"
description = "Private transcript-based audio and video editor"
authors = ["Cody Bontecou"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rescript_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
hound = "3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-av-media = { path = "plugins/av-media" }
tauri-plugin-transcription = { path = "plugins/transcription" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
